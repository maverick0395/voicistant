name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency: deploy

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ghcr.io/maverick0395/voicistant-app
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Skipped until the VPS exists and the secrets are set (ROADMAP E4).
      - name: Deploy to VPS
        if: env.VPS_HOST != ''
        env:
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "deploy@$VPS_HOST" "$SHA"
